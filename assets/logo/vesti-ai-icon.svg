<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="iconAiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7657FF"/>
      <stop offset="50%" stop-color="#9E85FF"/>
      <stop offset="100%" stop-color="#FF77B7"/>
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with midnight black fill -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="#111018" stroke="url(#iconAiGrad)" stroke-width="2.5"/>

  <!-- AI Geometric Hexagon Structure -->
  <path d="M50 12 L82 30 L82 70 L50 88 L18 70 L18 30 Z" stroke="#B9A7FF" stroke-width="1.8" fill="none" opacity="0.45"/>
  <line x1="18" y1="30" x2="50" y2="50" stroke="#7657FF" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6"/>
  <line x1="82" y1="30" x2="50" y2="50" stroke="#7657FF" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6"/>
  <line x1="50" y1="88" x2="50" y2="50" stroke="#FF77B7" stroke-width="1.2" opacity="0.6"/>

  <!-- Stylized Dress Silhouette -->
  <path d="M42 26 C44 23, 56 23, 58 26 L63 36 C58 38, 42 38, 37 36 Z" fill="url(#iconAiGrad)" filter="url(#iconGlow)"/>
  <path d="M43 36 C46 40, 54 40, 57 36 L68 76 C59 80, 41 80, 32 76 Z" fill="url(#iconAiGrad)"/>
  <line x1="42" y1="44" x2="58" y2="44" stroke="#FAF9FF" stroke-width="2" stroke-linecap="round"/>

  <!-- AI Nodes -->
  <circle cx="50" cy="12" r="3.5" fill="#FF77B7"/>
  <circle cx="82" cy="30" r="3" fill="#7657FF"/>
  <circle cx="82" cy="70" r="3" fill="#B9A7FF"/>
  <circle cx="50" cy="88" r="3.5" fill="#FF77B7"/>
  <circle cx="18" cy="70" r="3" fill="#7657FF"/>
  <circle cx="18" cy="30" r="3" fill="#B9A7FF"/>
  <circle cx="50" cy="50" r="4" fill="#FAF9FF" filter="url(#iconGlow)"/>

  <!-- Sparkle Particle -->
  <polygon points="74,18 76,22 80,24 76,26 74,30 72,26 68,24 72,22" fill="#FF77B7"/>
</svg>
