<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7657FF"/>
      <stop offset="50%" stop-color="#9E85FF"/>
      <stop offset="100%" stop-color="#FF77B7"/>
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B9A7FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF77B7" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ICON EMBLEM -->
  <g transform="translate(10, 10)">
    <!-- Tech Hexagon/Facet Outer Ring -->
    <path d="M40 4 L72 22 L72 58 L40 76 L8 58 L8 22 Z" stroke="url(#aiGradient)" stroke-width="2.5" fill="none" stroke-linejoin="round" opacity="0.4"/>
    
    <!-- AI Neural Grid Lines & Points -->
    <line x1="8" y1="22" x2="40" y2="40" stroke="#B9A7FF" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6"/>
    <line x1="72" y1="22" x2="40" y2="40" stroke="#B9A7FF" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6"/>
    <line x1="40" y1="76" x2="40" y2="40" stroke="#FF77B7" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6"/>
    
    <!-- Modern Stylized Dress Silhouette -->
    <path d="M33 18 C35 15, 45 15, 47 18 L51 28 C47 30, 33 30, 29 28 Z" fill="url(#aiGradient)" filter="url(#glow)"/>
    <path d="M34 28 C37 32, 43 32, 46 28 L56 64 C48 68, 32 68, 24 64 Z" fill="url(#aiGradient)"/>
    
    <!-- Waistline Accent Belt -->
    <line x1="33" y1="36" x2="47" y2="36" stroke="#FAF9FF" stroke-width="2" stroke-linecap="round"/>

    <!-- Neural Constellation Nodes -->
    <circle cx="40" cy="4" r="3" fill="#FF77B7"/>
    <circle cx="72" cy="22" r="3" fill="#7657FF"/>
    <circle cx="72" cy="58" r="3" fill="#B9A7FF"/>
    <circle cx="40" cy="76" r="3" fill="#FF77B7"/>
    <circle cx="8" cy="58" r="3" fill="#7657FF"/>
    <circle cx="8" cy="22" r="3" fill="#B9A7FF"/>
    
    <!-- Center AI Core Node -->
    <circle cx="40" cy="40" r="3.5" fill="#FAF9FF" filter="url(#glow)"/>
    
    <!-- Subtle Sparkle Particles -->
    <polygon points="62,10 64,15 69,17 64,19 62,24 60,19 55,17 60,15" fill="#FF77B7" opacity="0.85"/>
  </g>

  <!-- WORDMARK: "Vesti" + "AI" -->
  <g transform="translate(105, 62)">
    <!-- "Vesti" in elegant modern typography -->
    <text font-family="'Outfit', -apple-system, sans-serif" font-weight="700" font-size="44" fill="#FAF9FF" letter-spacing="-0.5">
      Vesti
    </text>
    
    <!-- Hyphen / Dot Bridge -->
    <circle cx="122" cy="-14" r="3" fill="#FF77B7"/>

    <!-- "AI" highlighted with gradient and glow -->
    <text x="134" y="0" font-family="'Outfit', -apple-system, sans-serif" font-weight="800" font-size="44" fill="url(#aiGradient)" filter="url(#glow)">
      AI
    </text>
  </g>
  
  <!-- Sub-label: FASHION TECH -->
  <text x="106" y="82" font-family="'Outfit', -apple-system, sans-serif" font-weight="500" font-size="11" fill="#B9A7FF" letter-spacing="3.5" opacity="0.85">
    VIRTUAL DRESSING ROOM
  </text>
</svg>
